[project]
name = "agenticmind-workspace"
version = "0.1.0"
description = "AgenticMind monorepo workspace (Python side)"
requires-python = ">=3.11"
dependencies = [
    "agenticmind-ir",
    "agenticmind-node-sdk",
    "agenticmind-registry",
    "agenticmind-providers[local]",
    "agenticmind-vectorstores[chroma,faiss,lancedb,pgvector,pinecone,milvus,weaviate,mongodb,redis,search]",
    "agenticmind-runtime",
    "agenticmind-nodes-core",
    "agenticmind-nodes-data",
    "agenticmind-nodes-rag",
    "agenticmind-nodes-agents",
    "agenticmind-nodes-semantic[postgres]",
    "agenticmind-compiler",
    "agenticmind-deployment",
    "agenticmind-plugins",
    "agenticmind-evaluation",
    "agenticmind-api",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    # Milvus Lite (local file mode) for the vector store contract tests; not published for Windows
    "milvus-lite>=2.5; sys_platform != 'win32'",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.6",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "nodes/*", "apps/api"]

[tool.uv.sources]
agenticmind-ir = { workspace = true }
agenticmind-node-sdk = { workspace = true }
agenticmind-registry = { workspace = true }
agenticmind-providers = { workspace = true }
agenticmind-vectorstores = { workspace = true }
agenticmind-runtime = { workspace = true }
agenticmind-nodes-core = { workspace = true }
agenticmind-nodes-data = { workspace = true }
agenticmind-nodes-rag = { workspace = true }
agenticmind-nodes-agents = { workspace = true }
agenticmind-nodes-semantic = { workspace = true }
agenticmind-compiler = { workspace = true }
agenticmind-deployment = { workspace = true }
agenticmind-plugins = { workspace = true }
agenticmind-evaluation = { workspace = true }
agenticmind-api = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["packages", "nodes", "apps/api/tests"]
addopts = "--import-mode=importlib"
pythonpath = ["packages/runtime/tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "UP042"]  # FastAPI Depends(); str-mixin enums are deliberate
