[project]
name = "agenticmind-api"
version = "0.1.0"
description = "AgenticMind control-plane API (FastAPI)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.30",
    "agenticmind-ir",
    "agenticmind-node-sdk",
    "agenticmind-registry",
    "agenticmind-runtime",
    "agenticmind-compiler",
    "agenticmind-evaluation",
    "agenticmind-nodes-core",
    "agenticmind-nodes-data",
    "agenticmind-nodes-rag",
    "agenticmind-nodes-agents",
    "agenticmind-providers[local]",
    "agenticmind-vectorstores",
    "python-multipart>=0.0.34",
    "python-dotenv>=1.2.4",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_api"]
