[project]
name = "agenticmind-nodes-agents"
version = "0.1.0"
description = "AgenticMind agent nodes: Agent, and tools (knowledge search, calculator, web fetch, date/time)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "agenticmind-node-sdk",
    "agenticmind-providers",
    "agenticmind-vectorstores",
    "agenticmind-nodes-rag",
    "agenticmind-nodes-data",
    "jsonschema>=4.26.0",
    "tzdata>=2026.6",
    "mcp>=2.3.0",
]

[project.entry-points."agenticmind.nodes"]
agents = "agenticmind_nodes_agents:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_nodes_agents"]
