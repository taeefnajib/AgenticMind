[project]
name = "agenticmind-nodes-semantic"
version = "0.1.0"
description = "AgenticMind semantic data nodes: database connector, schema inspector, profiler, SQL policy and NL-to-SQL"
requires-python = ">=3.11"
dependencies = [
    "agenticmind-node-sdk",
    "agenticmind-providers",
    # SQL parsing for the read-only policy; pinned to a release older than two weeks at adoption time
    "sqlglot==30.29.0",
]

[project.optional-dependencies]
postgres = ["psycopg[binary]>=3.1"]

[project.entry-points."agenticmind.nodes"]
semantic = "agenticmind_nodes_semantic:register"

# Agent tool implementation, discovered through the tool plugin mechanism (ADR-0014).
[project.entry-points."agenticmind.tools"]
sql_query = "agenticmind_nodes_semantic.tools:run_sql_tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_nodes_semantic"]
