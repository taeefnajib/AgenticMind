[project]
name = "agenticmind-nodes-semantic"
version = "0.1.0"
description = "AgenticMind semantic data nodes: database connector, schema inspector, profiler, SQL policy, NL-to-SQL and the NVIDIA Auto Ontology adapter"
requires-python = ">=3.11"
dependencies = [
    "agenticmind-node-sdk",
    "agenticmind-providers",
    # SQL parsing for the read-only policy; pinned to a release older than two weeks at adoption time
    "sqlglot==30.29.0",
    "httpx>=0.28.1",
]

[project.optional-dependencies]
# Database drivers (the API installs all of them). Databricks, ClickHouse and BigQuery use their HTTP APIs
# through httpx, so they need no driver; BigQuery signs its service-account token with `cryptography`.
postgres = ["psycopg[binary]>=3.1"]
mysql = ["pymysql>=1.1"]
sqlserver = ["pymssql>=2.3"]
snowflake = ["snowflake-connector-python>=3.12"]
duckdb = ["duckdb>=1.2"]
bigquery = ["cryptography>=44"]
all = ["agenticmind-nodes-semantic[postgres,mysql,sqlserver,snowflake,duckdb,bigquery]"]

[project.entry-points."agenticmind.nodes"]
semantic = "agenticmind_nodes_semantic:register"

# Agent tool implementation, discovered through the tool plugin mechanism (ADR-0014).
[project.entry-points."agenticmind.tools"]
sql_query = "agenticmind_nodes_semantic.tools:run_sql_tool"
auto_ontology = "agenticmind_nodes_semantic.tools:run_ontology_tool"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_nodes_semantic"]
