[project]
name = "agenticmind-nodes-rag"
version = "0.1.0"
description = "AgenticMind RAG nodes (chunking; embeddings, retrieval and context building follow)"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["agenticmind-node-sdk", "agenticmind-providers", "agenticmind-vectorstores"]

[project.entry-points."agenticmind.nodes"]
rag = "agenticmind_nodes_rag:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_nodes_rag"]
