[project]
name = "agenticmind-nodes-data"
version = "0.1.0"
description = "AgenticMind data ingestion nodes (document loading, parsing, cleaning)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "agenticmind-node-sdk",
    "pypdf>=7.1.0",
    "python-docx>=1.2.0",
]

[project.optional-dependencies]
# open-source OCR for images and scanned PDFs (PaddleOCR models on ONNX Runtime); Pillow lets pypdf decode page images
ocr = ["rapidocr>=3.10", "onnxruntime>=1.20", "pillow>=11"]
# Amazon S3 and S3-compatible storage (MinIO, Cloudflare R2, Wasabi, ...)
s3 = ["boto3>=1.35"]

[project.entry-points."agenticmind.nodes"]
data = "agenticmind_nodes_data:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_nodes_data"]
