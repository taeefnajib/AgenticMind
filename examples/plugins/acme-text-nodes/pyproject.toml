[project]
name = "acme-text-nodes"
version = "0.1.0"
description = "AgenticMind nodes by acme"
requires-python = ">=3.11"
# agenticmind-* packages are provided by the AgenticMind host; list only your other dependencies here
dependencies = ["agenticmind-node-sdk"]

[project.entry-points."agenticmind.nodes"]
acme_text_nodes = "acme_text_nodes:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/acme_text_nodes"]
