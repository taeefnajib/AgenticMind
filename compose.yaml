# Self-hosted AgenticMind.
#   docker compose up --build                     -> http://localhost:8000 (SQLite in a volume)
#   docker compose --profile postgres up --build  -> also starts PostgreSQL (set AGENTICMIND_DATABASE_URL)
# Sign-in is off by default, so the port is published on localhost only. To serve other machines, set
# AGENTICMIND_AUTH=required in .env and AGENTICMIND_BIND=0.0.0.0.
services:
  agenticmind:
    build:
      context: .
      dockerfile: infra/docker/Dockerfile
    ports:
      - "${AGENTICMIND_BIND:-127.0.0.1}:8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      AGENTICMIND_DATABASE_URL: ${AGENTICMIND_DATABASE_URL:-sqlite:////data/agenticmind.db}
      AGENTICMIND_IN_PROCESS_TRUST: ${AGENTICMIND_IN_PROCESS_TRUST:-core}
    volumes:
      - agenticmind-data:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

  postgres:
    profiles: ["postgres"]
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: agenticmind
      POSTGRES_PASSWORD: agenticmind
      POSTGRES_DB: agenticmind
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  agenticmind-data:
  postgres-data:
