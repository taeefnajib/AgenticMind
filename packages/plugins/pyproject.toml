[project]
name = "agenticmind-plugins"
version = "0.1.0"
description = "AgenticMind plugin packages: install third-party node packages and run them in isolated workers"
requires-python = ">=3.11"
dependencies = [
    "agenticmind-ir",
    "agenticmind-node-sdk",
    "agenticmind-registry",
    "jsonschema>=4.26.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_plugins"]
