[project]
name = "probe-nodes"
version = "1.0.0"
description = "Test plugin that probes the isolation boundary"
requires-python = ">=3.11"
dependencies = ["agenticmind-node-sdk"]

[project.entry-points."agenticmind.nodes"]
probe_nodes = "probe_nodes:register"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/probe_nodes"]
