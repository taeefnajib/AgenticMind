[project]
name = "agenticmind-providers"
version = "0.1.0"
description = "AgenticMind model provider adapter layer"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "agenticmind-node-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_providers"]
