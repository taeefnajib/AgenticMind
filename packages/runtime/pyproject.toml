[project]
name = "agenticmind-runtime"
version = "0.1.0"
description = "AgenticMind first-party runtime: graph validation, execution planning, scheduling and traces"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "agenticmind-ir", "agenticmind-node-sdk", "agenticmind-registry"]

[project.scripts]
agenticmind = "agenticmind_runtime.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_runtime"]
