[project]
name = "agenticmind-evaluation"
version = "0.1.0"
description = "AgenticMind Evaluation Lab: versioned datasets, evaluators, LLM judges and run comparison"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "agenticmind-ir",
    "agenticmind-node-sdk",
    "agenticmind-registry",
    "agenticmind-runtime",
    "agenticmind-providers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_evaluation"]
