[project]
name = "agenticmind-registry"
version = "0.1.0"
description = "AgenticMind node registry: discovery, versions and trust metadata"
requires-python = ">=3.11"
dependencies = ["agenticmind-node-sdk"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_registry"]
