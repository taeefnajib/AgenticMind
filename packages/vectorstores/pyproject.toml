[project]
name = "agenticmind-vectorstores"
version = "0.1.0"
description = "AgenticMind vector store adapter layer (Qdrant default; Chroma, FAISS, LanceDB, pgvector, Pinecone, Milvus, Weaviate, Elasticsearch, OpenSearch, MongoDB Atlas, Redis)"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.7,<3",
    "qdrant-client>=1.20.0",
]

[project.optional-dependencies]
chroma = [
    "chromadb>=1.5.9",
]
pgvector = [
    "psycopg[binary]>=3.3.9",
]
pinecone = [
    "pinecone>=10.3.0",
]
faiss = ["faiss-cpu>=1.9", "numpy>=1.26"]
lancedb = ["lancedb>=0.25", "pyarrow>=17"]
milvus = ["pymilvus>=2.6"]
weaviate = ["weaviate-client>=4.16"]
mongodb = ["pymongo>=4.10"]
redis = ["redis>=5.2", "numpy>=1.26"]
# Elasticsearch and OpenSearch use their REST APIs through httpx (no client library needed)
search = ["httpx>=0.28.1"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_vectorstores"]
