[project]
name = "agenticmind-observability"
version = "0.1.0"
description = "AgenticMind observability: OpenTelemetry (OTLP) trace export and Prometheus metrics from run traces"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["pydantic>=2.7,<3", "agenticmind-runtime", "opentelemetry-proto>=1.45", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_observability"]
