[project]
name = "agenticmind-node-sdk"
version = "0.1.0"
description = "AgenticMind Node SDK: typed port system, node manifests, handler contracts and test helpers"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.7,<3", "agenticmind-ir"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_node_sdk"]
