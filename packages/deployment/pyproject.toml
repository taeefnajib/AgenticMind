[project]
name = "agenticmind-deployment"
version = "0.1.0"
description = "AgenticMind Deployment Center: target capability checks, deployment plans and artifacts, local Docker deployer"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "agenticmind-ir",
    "agenticmind-registry",
    "agenticmind-compiler",
    # readable Kubernetes / Cloud Run / Compose manifests
    "pyyaml>=6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_deployment"]
