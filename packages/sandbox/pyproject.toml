[project]
name = "agenticmind-sandbox"
version = "0.1.0"
description = "AgenticMind sandboxed code execution (Docker containers by default; an opt-in local process mode)"
requires-python = ">=3.11"
license = "MIT"
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_sandbox"]
