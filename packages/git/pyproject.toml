[project]
name = "agenticmind-git"
version = "0.1.0"
description = "AgenticMind version control: push projects to GitHub as atomic commits, history and restore"
requires-python = ">=3.11"
license = "MIT"
dependencies = ["httpx>=0.27", "agenticmind-ir"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_git"]
