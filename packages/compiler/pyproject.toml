[project]
name = "agenticmind-compiler"
version = "0.1.0"
description = "AgenticMind compiler: canonical IR to a standalone, runnable FastAPI project"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "agenticmind-ir",
    "agenticmind-node-sdk",
    "agenticmind-registry",
    "agenticmind-runtime",
    # formats and lints the generated sources (compiler pipeline step 6)
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agenticmind_compiler"]
